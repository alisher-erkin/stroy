<style>
  :root {
    --bg: #000000;
    --bg-2: #0b162f;
    --card: #0d1424;
    --line: rgba(92, 142, 216, 0.22);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.66);
    --blue: #5c8ed8;
    --blue-hover: #77a3e4;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Manrope', system-ui, sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  b, .accent { color: var(--blue); font-weight: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  section { padding: 96px 0; }
  h2 { font-size: clamp(30px, 4vw, 46px); line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
  .lead { color: var(--muted); font-size: 18px; max-width: 640px; }
  .head { margin-bottom: 48px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 54px; padding: 0 28px; border-radius: 999px; font-weight: 700; font-size: 16px; border: 1.5px solid var(--blue); cursor: pointer; transition: .2s; font-family: inherit; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
  .btn-ghost { background: transparent; color: #fff; }
  .btn-ghost:hover { background: rgba(92, 142, 216, 0.12); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }

  /* Header */
  header { position: sticky; top: 0; z-index: 50; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 20px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.18em; font-size: 18px; }
  .logo-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--blue); display: grid; place-items: center; font-size: 22px; letter-spacing: 0; font-family: Georgia, serif; }
  .menu { display: flex; gap: 28px; font-size: 15px; color: var(--muted); }
  .menu a:hover { color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { background: none; border: 0; color: var(--muted); font: 600 13px Manrope, sans-serif; padding: 8px 12px; cursor: pointer; }
  .lang button.on { background: var(--blue); color: #fff; }
  .phone { font-weight: 700; font-size: 15px; white-space: nowrap; }

  /* Hero */
  .hero { position: relative; min-height: min(calc(100vh - 72px), 820px); display: flex; align-items: center; padding: 80px 0; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background: url(img/hero.jpg) center/cover no-repeat; }
  .hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #000 0%, rgba(0,0,0,.85) 38%, rgba(0,0,0,.25) 75%, rgba(0,0,0,.1) 100%), linear-gradient(0deg, #000 0%, transparent 30%); }
  .hero .wrap { position: relative; width: 100%; }
  .hero h1 { font-size: clamp(38px, 6vw, 72px); line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; max-width: 720px; margin-bottom: 24px; }
  .hero p { font-size: clamp(17px, 2vw, 21px); color: var(--muted); max-width: 560px; margin-bottom: 36px; }
  .hero p b { color: var(--blue); font-weight: 700; }
  .cta { display: flex; flex-wrap: wrap; gap: 14px; }

  /* Trust */
  .trust { padding: 0; margin-top: -1px; }
  .trust-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .trust-item { padding: 26px; }
  .trust-item .ico { width: 44px; height: 44px; border-radius: 12px; background: rgba(92, 142, 216, 0.14); display: grid; place-items: center; margin-bottom: 16px; color: var(--blue); }
  .trust-item h3 { font-size: 18px; margin-bottom: 6px; }
  .trust-item p { color: var(--muted); font-size: 15px; }

  /* Services */
  .svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .svc { overflow: hidden; display: flex; flex-direction: column; }
  .svc img { aspect-ratio: 4/3.4; object-fit: cover; width: 100%; }
  .svc-body { padding: 26px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .svc h3 { font-size: 22px; }
  .svc p { color: var(--muted); font-size: 15px; flex: 1; }
  .price { font-size: 26px; font-weight: 800; }
  .price small { font-size: 15px; color: var(--muted); font-weight: 600; }
  .svc-note { margin-top: 20px; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .chip { padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); font-size: 15px; }
  .chip span { color: var(--muted); }

  /* Calculator */
  .calc-sec { background: linear-gradient(180deg, #000 0%, var(--bg-2) 50%, #000 100%); }
  .calc { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
  .calc-form { padding: 36px; display: grid; gap: 28px; }
  label { display: block; font-weight: 700; margin-bottom: 12px; }
  .area-row { display: flex; align-items: center; gap: 18px; }
  input[type=range] { flex: 1; accent-color: var(--blue); height: 6px; }
  .area-val { min-width: 96px; text-align: right; font-size: 26px; font-weight: 800; }
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .types button { background: transparent; border: 1.5px solid var(--line); color: #fff; border-radius: 14px; padding: 14px 10px; font: 600 15px Manrope, sans-serif; cursor: pointer; text-align: center; }
  .types button small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; margin-top: 4px; }
  .types button.on { border-color: var(--blue); background: rgba(92, 142, 216, 0.14); }
  .calc-result { padding: 36px; display: flex; flex-direction: column; justify-content: center; gap: 14px; border-color: var(--blue); }
  .calc-result .lbl { color: var(--muted); }
  .calc-result .sum { font-size: clamp(32px, 4vw, 44px); font-weight: 800; line-height: 1.15; color: var(--blue); }
  .calc-result .hint { color: var(--muted); font-size: 14px; }

  /* Steps */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; }
  .step { padding: 24px; display: flex; gap: 16px; align-items: flex-start; }
  .step::before { counter-increment: s; content: counter(s, decimal-leading-zero); color: var(--blue); font-weight: 800; font-size: 22px; line-height: 1.2; }
  .step p { font-weight: 600; }

  /* Videos */
  .vid-grid { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 900px; gap: 16px; }
  .vid { position: relative; overflow: hidden; border-radius: var(--radius); aspect-ratio: 9/16; border: 1px solid var(--line); }
  .vid img { width: 100%; height: 100%; object-fit: cover; transition: .4s; }
  .vid:hover img { transform: scale(1.04); }
  .vid::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.92) 0%, transparent 55%); }
  .vid .play { position: absolute; top: 16px; right: 16px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; }
  .vid h3 { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; font-size: 18px; line-height: 1.3; }
  .vid-more { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center; padding: 24px; aspect-ratio: 9/16; }
  .vid-more p { color: var(--muted); }

  /* Gallery */
  .gal { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
  .gal figure { position: relative; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line); }
  .gal img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 3/4; }
  .gal figcaption { position: absolute; left: 14px; bottom: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.7); font-size: 13px; color: var(--muted); }

  /* FAQ */
  .faq { display: grid; gap: 12px; max-width: 860px; }
  details { padding: 22px 26px; }
  summary { cursor: pointer; font-weight: 700; font-size: 18px; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  summary::after { content: "+"; color: var(--blue); font-size: 26px; line-height: 1; }
  details[open] summary::after { content: "−"; }
  details p { color: var(--muted); margin-top: 12px; }

  /* Contact */
  .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .contact-info { padding: 36px; display: flex; flex-direction: column; gap: 22px; }
  .contact-info .row span { display: block; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .contact-info .row a, .contact-info .row div { font-size: 20px; font-weight: 700; }
  form.card { padding: 36px; display: grid; gap: 16px; }
  input[type=text], input[type=tel], input[type=number] { width: 100%; height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: #000; color: #fff; padding: 0 18px; font: 500 16px Manrope, sans-serif; }
  input::placeholder { color: rgba(255, 255, 255, 0.4); }
  input:focus { outline: none; border-color: var(--blue); }
  .form-msg { color: var(--blue); font-weight: 600; display: none; }

  footer { border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 36px 0 110px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

  /* Mobile sticky bar */
  .mbar { display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 60; gap: 10px; }
  .mbar .btn { flex: 1; height: 52px; }

  @media (max-width: 960px) {
    .menu, .phone { display: none; }
    .trust-grid { grid-template-columns: repeat(2, 1fr); }
    .svc-grid, .calc, .contact { grid-template-columns: 1fr; }
    .steps { grid-template-columns: repeat(2, 1fr); }
    .vid-grid { grid-template-columns: repeat(2, 1fr); }
    .gal { grid-template-columns: 1fr 1fr; }
    .gal figure:first-child { grid-column: span 2; }
    .gal figure:first-child img { aspect-ratio: 4/3; }
    .mbar { display: flex; }
  }
  @media (max-width: 560px) {
    section { padding: 68px 0; }
    .hero { min-height: auto; padding: 90px 0 70px; }
    .hero-bg::after { background: linear-gradient(0deg, #000 8%, rgba(0,0,0,.7) 60%, rgba(0,0,0,.45) 100%); }
    .cta .btn { width: 100%; }
    .trust-grid, .steps { grid-template-columns: 1fr; }
    .types { grid-template-columns: 1fr; }
    .calc-form, .calc-result, .contact-info, form.card { padding: 24px; }
    .vid-more { aspect-ratio: auto; }
  }
</style>
</head>

let lang = 'ru', type = 1;
const $ = (s) => document.querySelector(s);
const fmt = (n) => n.toLocaleString('ru-RU').replace(/ /g, ' ');

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.innerHTML = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-ph]').forEach((el) => { el.placeholder = t[el.dataset.ph]; });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  $('#trust').innerHTML = t.trust.map(([i, h, p]) => `<div class="card trust-item"><div class="ico">${ICONS[i]}</div><h3>${h}</h3><p>${p}</p></div>`).join('');
  $('#svc').innerHTML = t.svc.map(([h, p], i) => `<div class="card svc"><img src="${IMGS[i]}" alt=""><div class="svc-body"><h3>${h}</h3><p>${p}</p><div class="price">${t.priceFmt(...PRICES[i])}</div></div></div>`).join('');
  $('#chips').innerHTML = t.chips.map(([a, b]) => `<div class="chip">${a} · <span>${b}</span></div>`).join('');
  $('#types').innerHTML = t.types.map((n, i) => `<button type="button" data-t="${i}" class="${i === type ? 'on' : ''}">${n}<small>$${PRICES[i][0]}–${PRICES[i][1]}/m²</small></button>`).join('');
  $('#stepsList').innerHTML = t.steps.map((s) => `<div class="card step"><p>${s}</p></div>`).join('');
  $('#faq').innerHTML = t.faq.map(([q, a]) => `<details class="card"><summary>${q}</summary><p>${a}</p></details>`).join('');
  calc();
}

function calc() {
  const area = +$('#area').value;
  $('#areaVal').textContent = area;
  const [a, b] = PRICES[type];
  $('#sum').textContent = T[lang].sumFmt(fmt(a * area), fmt(b * area));
}

document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));
$('#area').addEventListener('input', calc);
$('#types').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  type = +b.dataset.t;
  document.querySelectorAll('#types button').forEach((x) => x.classList.toggle('on', x === b));
  calc();
});
$('#form').addEventListener('submit', (e) => { e.preventDefault(); $('#formMsg').style.display = 'block'; });
render();
</script>
